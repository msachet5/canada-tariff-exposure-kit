[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "canada-tariff-exposure-kit"
version = "0.1.0"
description = "Versioned dataset of Canadian surtax orders on US goods plus a calculator: upload purchase history, get surtax exposure, CUSMA flags and remission leads."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Sachet Mulimani", email = "sachetmulimani@gmail.com" }]
dependencies = ["polars>=1.0", "requests>=2.31", "beautifulsoup4>=4.12"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
tariffkit = "tariffkit.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tariffkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
